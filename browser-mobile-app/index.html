<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8eef0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bloom Club" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/docs/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="preload" href="/assets/loader/bloom-loader.mp4" as="video" type="video/mp4" />
    <title>Bloom Club</title>
    <style>
      #bloom-html-fallback-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        overflow: hidden;
        color: #54333f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        background:
          radial-gradient(circle at 50% 34%, rgba(255, 255, 255, 0.92), transparent 36%),
          linear-gradient(155deg, #fff8f5 0%, #fbe8eb 55%, #f5dce3 100%);
        opacity: 1;
        transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      #bloom-html-fallback-overlay::before,
      #bloom-html-fallback-overlay::after {
        position: absolute;
        width: 19rem;
        height: 19rem;
        border-radius: 50%;
        content: "";
        pointer-events: none;
        filter: blur(2.8rem);
        opacity: 0.34;
      }

      #bloom-html-fallback-overlay::before {
        top: -9rem;
        right: -8rem;
        background: #efb8c8;
      }

      #bloom-html-fallback-overlay::after {
        bottom: -10rem;
        left: -8rem;
        background: #f7d5c0;
      }

      .bloom-startup-splash__content {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 0.8rem;
        width: min(100%, 22rem);
      }

      .bloom-startup-splash__video {
        display: block;
        width: clamp(12rem, 58vw, 17rem);
        aspect-ratio: 1;
        border-radius: 2rem;
        object-fit: contain;
        mix-blend-mode: multiply;
        filter: drop-shadow(0 1.2rem 2.4rem rgba(112, 63, 81, 0.14));
      }

      .bloom-startup-splash__content h1 {
        margin: 0.25rem 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 8vw, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .bloom-startup-splash__content > p {
        margin: 0;
        color: rgba(84, 51, 63, 0.7);
        font-size: 0.86rem;
        font-weight: 600;
      }

      .bloom-startup-splash__recovery {
        display: none;
        gap: 0.65rem;
        justify-items: center;
        margin-top: 0.5rem;
      }

      .bloom-startup-splash__recovery.is-visible {
        display: grid;
      }

      .bloom-startup-splash__recovery button {
        min-height: 2.75rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(84, 51, 63, 0.14);
        border-radius: 999px;
        color: #54333f;
        background: rgba(255, 255, 255, 0.72);
        font: inherit;
        font-weight: 700;
      }

      @media (prefers-reduced-motion: reduce) {
        #bloom-html-fallback-overlay {
          transition-duration: 120ms;
        }

        .bloom-startup-splash__video {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section
      id="bloom-html-fallback-overlay"
      role="status"
      aria-live="polite"
    >
      <div class="bloom-startup-splash__content">
        <video
          id="bloom-startup-video"
          class="bloom-startup-splash__video"
          autoplay
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-hidden="true"
        >
          <source src="/assets/loader/bloom-loader.mp4" type="video/mp4" />
        </video>
        <h1>Bloom Club</h1>
        <p>Подготавливаем ваши привилегии…</p>
        <div class="bloom-startup-splash__recovery" id="bloom-startup-recovery">
          <button type="button" onclick="location.reload()">Перезагрузить</button>
          <p id="bloom-html-fallback-diagnostic">Проверяем запуск приложения…</p>
        </div>
      </div>
    </section>
    <script>
      window.__BLOOM_STARTUP_SPLASH_STARTED_AT__ = Date.now();
      window.__BLOOM_STARTUP_SPLASH_MINIMUM_MS__ = 5000;
      window.__BLOOM_HTML_FALLBACK_PRESENT__ = true;
      window.__BLOOM_HTML_FALLBACK_REMOVED__ = false;
      window.__BLOOM_ENTRY_SCRIPT_EXECUTED__ = false;
      window.__BLOOM_EARLY_STARTUP_TRACE__ = window.__BLOOM_EARLY_STARTUP_TRACE__ || [];
      window.__BLOOM_RESOURCE_ERROR_TRACE__ = window.__BLOOM_RESOURCE_ERROR_TRACE__ || [];
      window.__BLOOM_EARLY_STARTUP_TRACE__.push({ step: "html_inline_before_module", at: new Date().toISOString(), href: location.href });
      window.addEventListener("error", function bloomEarlyError(event) {
        var target = event && event.target;
        var isResource = target && target !== window && (target.src || target.href);
        var payload = {
          at: new Date().toISOString(),
          kind: isResource ? "resource_error" : "window_error",
          message: event && event.message ? String(event.message) : "",
          filename: event && event.filename ? String(event.filename) : "",
          line: event && event.lineno || 0,
          column: event && event.colno || 0,
          tagName: isResource && target.tagName ? String(target.tagName).toLowerCase() : "",
          url: isResource ? String(target.src || target.href || "") : "",
        };
        window.__BLOOM_RESOURCE_ERROR_TRACE__.push(payload);
        window.__BLOOM_EARLY_STARTUP_TRACE__.push(payload);
        var recovery = document.getElementById("bloom-startup-recovery");
        var diagnostic = document.getElementById("bloom-html-fallback-diagnostic");
        if (recovery) {
          recovery.classList.add("is-visible");
        }
        if (diagnostic && isResource) {
          diagnostic.textContent = "Не удалось загрузить один из ресурсов приложения.";
          diagnostic.setAttribute("role", "alert");
        }
      }, true);
      window.addEventListener("unhandledrejection", function bloomEarlyRejection(event) {
        window.__BLOOM_EARLY_STARTUP_TRACE__.push({ at: new Date().toISOString(), kind: "unhandledrejection", reason: String(event && event.reason && (event.reason.message || event.reason) || "") });
      });
      window.setTimeout(function bloomHtmlEntryWatchdog() {
        if (window.__BLOOM_ENTRY_SCRIPT_EXECUTED__ === true || window.__BLOOM_HTML_FALLBACK_REMOVED__ === true) {
          return;
        }
        var recovery = document.getElementById("bloom-startup-recovery");
        var diagnostic = document.getElementById("bloom-html-fallback-diagnostic");
        if (recovery) {
          recovery.classList.add("is-visible");
        }
        if (diagnostic) {
          diagnostic.textContent = "Запуск занимает больше времени, чем обычно.";
          diagnostic.setAttribute("role", "alert");
        }
      }, 8000);

      (function startBloomSplashVideo() {
        var video = document.getElementById("bloom-startup-video");
        if (!video) return;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        var playResult = video.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(function () {
            // The branded shell and copy remain visible if iOS blocks autoplay.
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
